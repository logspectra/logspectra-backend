name: CI

on:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout logspectra-ai
        uses: actions/checkout@v4
        with:
          repository: logspectra/logspectra-ai
          path: logspectra-ai
          # Use same ref when both repos use matching branch names; otherwise default branch.
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Install logspectra-ai
        run: mvn -B -ntp -f logspectra-ai/pom.xml install -DskipTests

      - name: Test backend
        run: mvn -B -ntp verify
