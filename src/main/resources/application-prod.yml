spring:
  jackson:
    time-zone: UTC
    deserialization:
      adjust-dates-to-context-time-zone: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/logspectra}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

elasticsearch:
  uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
  username: ${ELASTICSEARCH_USERNAME:elastic}
  password: ${ELASTICSEARCH_PASSWORD:changeme}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

ai:
  openai:
    base-url: ${AI_OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${AI_OPENAI_API_KEY:${OPENAI_API_KEY:}}
  claude:
    base-url: ${AI_CLAUDE_BASE_URL:https://api.anthropic.com}
    api-key: ${AI_CLAUDE_API_KEY:${CLAUDE_API_KEY:}}
    api-version: ${AI_CLAUDE_API_VERSION:2023-06-01}
  ollama:
    host: ${AI_OLLAMA_HOST:docker.internal}
    port: ${AI_OLLAMA_PORT:11434}

